apiVersion: template.openshift.io/v1
kind: Template
parameters:
  - name: NAME
    description: Module name
    required: true
  - name: COMPONENT
    description: Component name
    value: backend
  - name: ZONE
    description: Deployment zone, e.g. pr-### or prod
    required: true
  - name: IMAGE_TAG
    description: Image tag to use
    required: true
  # PR deploys pass the immutable head SHA as IMAGE_TAG, so every push changes
  # the pod spec and forces a rollout (the mutable PR-number tag would leave
  # `oc apply` seeing an unchanged Deployment and keep serving the stale image
  # despite imagePullPolicy: Always). Test deploys (merge.yml) use the
  # PR-number tag, which is unique per merge, so the spec changes there too.
  - name: REGISTRY
    description: Container registry to import from
    value: ghcr.io
  - name: ORG_NAME
    description: Organization name
    value: bcgov
  - name: DOMAIN
    description: OpenShift apps domain. Override when Gold is provisioned.
    value: apps.gold.devops.gov.bc.ca
  - name: MIN_REPLICAS
    description: The minimum amount of replicas for the horizontal pod autoscaler.
    value: "1"
  - name: MAX_REPLICAS
    description: The maximum amount of replicas for the horizontal pod autoscaler.
    value: "1"
  - name: CPU_REQUEST
    value: "30m"
  - name: MEMORY_REQUEST
    value: "256Mi"
  - name: MEMORY_LIMIT
    description: Container memory limit; the JVM heap sizes itself from this cgroup limit via MaxRAMPercentage (see backend/Dockerfile). Raised for the embedded JasperReports 7 engine (Batik/OpenPDF/fonts add classpath + metaspace + native AWT footprint) per AD-16 "size the reporting path's pod CPU/Mem".
    value: "1Gi"
  - name: ILCR_DATASOURCE_ENABLED
    description: Connect to the Oracle datasource. Set "false" for a data-less smoke deployment. Deployed pods always enforce Cognito (FAM) JWT auth — ILCR_SECURITY_ENABLED is hardcoded "true" below, not parameterized.
    value: "true"
  - name: LOG_LEVEL
    description: Application log level (debug|info|warn|error)
    value: "info"
  # NR User Lookup API (DL-27) — the ministry directory behind the assignment picker. Only the
  # NON-SECRET half is wired here. The service-account credential (ILCR_USER_LOOKUP_CLIENT_ID /
  # _SECRET) is a per-environment Vault secret that does not exist yet, and a secretKeyRef to a
  # missing Secret fails the pod — so it lands with the DL-27 onboarding story, together with
  # flipping ILCR_USER_LOOKUP_ENABLED to "true". The backend refuses to start with the flag on and
  # any of the four values blank, so the two cannot drift apart.
  - name: ILCR_USER_LOOKUP_ENABLED
    description: Enable the NR User Lookup directory search. Keep "false" until the DL-27 service account and Vault secret exist; the pod will not start with it "true" and the credential unset.
    value: "false"
  - name: ILCR_USER_LOOKUP_BASE_URL
    description: NR User Lookup API root. Non-secret; set at DL-27 onboarding.
    value: ""
  - name: ILCR_USER_LOOKUP_TOKEN_URL
    description: Keycloak token endpoint issuing the service-account token. Non-secret; set at DL-27 onboarding.
    value: ""
  # ORACLEDB_HOST / ORACLEDB_SERVICENAME are not parameters: they come from
  # environment-scoped GitHub secrets via the init-created backend Secret
  # (common/openshift.init.yml), read below with secretKeyRef.
  - name: ORACLEDB_PORT
    description: Oracle database TCPS port
    value: "1543"
objects:
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      labels:
        app: ${NAME}-${ZONE}
      name: ${NAME}-${ZONE}-${COMPONENT}
    spec:
      selector:
        matchLabels:
          deployment: ${NAME}-${ZONE}-${COMPONENT}
      strategy:
        type: RollingUpdate
      template:
        metadata:
          labels:
            app: ${NAME}-${ZONE}
            deployment: ${NAME}-${ZONE}-${COMPONENT}
        spec:
          terminationGracePeriodSeconds: 30
          affinity:
            podAntiAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  podAffinityTerm:
                    labelSelector:
                      matchLabels:
                        deployment: ${NAME}-${ZONE}-${COMPONENT}
                    topologyKey: kubernetes.io/hostname
          # Fetches the Oracle TCPS cert into a keystore on the api-cert PVC
          # before the app starts. Connecting out to the Oracle host is also
          # what triggers the namespace firewall rule for database egress.
          initContainers:
            - name: ${NAME}-init
              image: ghcr.io/bcgov/nr-forest-client/common:prod
              imagePullPolicy: Always
              env:
                - name: ORACLEDB_HOST
                  valueFrom:
                    secretKeyRef:
                      name: ${NAME}-${ZONE}-${COMPONENT}
                      key: ORACLEDB_HOST
                - name: ORACLEDB_PORT
                  value: ${ORACLEDB_PORT}
                - name: ORACLEDB_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: ${NAME}-${ZONE}-${COMPONENT}
                      key: ORACLEDB_KEYSTORE_SECRET
              volumeMounts:
                - name: api-cert
                  mountPath: /cert
                - name: init-tmp
                  mountPath: /tmp
              resources:
                requests:
                  cpu: "10m"
                  memory: "64Mi"
                  ephemeral-storage: "50Mi"
              securityContext:
                allowPrivilegeEscalation: false
                runAsNonRoot: true
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
                seccompProfile:
                  type: RuntimeDefault
          containers:
            - name: ${NAME}
              image: ${REGISTRY}/${ORG_NAME}/${NAME}/${COMPONENT}:${IMAGE_TAG}
              imagePullPolicy: Always
              ports:
                - name: http
                  containerPort: 8080
              env:
                - name: LOG_LEVEL
                  value: ${LOG_LEVEL}
                - name: SERVER_PORT
                  value: "8080"
                - name: SPRING_PROFILES_ACTIVE
                  value: openshift,oracle
                - name: APP_VERSION
                  value: ${IMAGE_TAG}
                - name: ILCR_SECURITY_ENABLED
                  value: "true"
                - name: ILCR_DATASOURCE_ENABLED
                  value: ${ILCR_DATASOURCE_ENABLED}
                # Story 29.2 — point the Jasper report virtualizer's swap file at the dedicated
                # DISK-backed ephemeral volume below, NOT java.io.tmpdir (/tmp here is a Memory-backed
                # emptyDir, so spilling there would stay in RAM and defeat the heap relief).
                - name: ILCR_REPORTING_SWAP_DIR
                  value: /var/tmp/report-swap
                # NR User Lookup (DL-27): non-secret half only — see the parameter block above for
                # why the credential waits for the Vault secret.
                - name: ILCR_USER_LOOKUP_ENABLED
                  value: ${ILCR_USER_LOOKUP_ENABLED}
                - name: ILCR_USER_LOOKUP_BASE_URL
                  value: ${ILCR_USER_LOOKUP_BASE_URL}
                - name: ILCR_USER_LOOKUP_TOKEN_URL
                  value: ${ILCR_USER_LOOKUP_TOKEN_URL}
                - name: ORACLEDB_HOST
                  valueFrom:
                    secretKeyRef:
                      name: ${NAME}-${ZONE}-${COMPONENT}
                      key: ORACLEDB_HOST
                - name: ORACLEDB_PORT
                  value: ${ORACLEDB_PORT}
                - name: ORACLEDB_SERVICENAME
                  valueFrom:
                    secretKeyRef:
                      name: ${NAME}-${ZONE}-${COMPONENT}
                      key: ORACLEDB_SERVICENAME
                - name: ORACLEDB_KEYSTORE
                  value: /cert/jssecacerts
                - name: ILCR_OIDC_ISSUER_URI
                  valueFrom:
                    configMapKeyRef:
                      name: ${NAME}-${ZONE}-backend-auth
                      key: ILCR_OIDC_ISSUER_URI
                - name: ILCR_OIDC_CLIENT_ID
                  valueFrom:
                    configMapKeyRef:
                      name: ${NAME}-${ZONE}-backend-auth
                      key: ILCR_OIDC_CLIENT_ID
                - name: ORACLEDB_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: ${NAME}-${ZONE}-${COMPONENT}
                      key: ORACLEDB_KEYSTORE_SECRET
                - name: SPRING_DATASOURCE_USERNAME
                  valueFrom:
                    secretKeyRef:
                      name: ${NAME}-${ZONE}-${COMPONENT}
                      key: SPRING_DATASOURCE_USERNAME
                - name: SPRING_DATASOURCE_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: ${NAME}-${ZONE}-${COMPONENT}
                      key: SPRING_DATASOURCE_PASSWORD
              resources:
                requests:
                  cpu: ${CPU_REQUEST}
                  memory: ${MEMORY_REQUEST}
                  ephemeral-storage: "256Mi"
                limits:
                  memory: ${MEMORY_LIMIT}
                  # Bound total ephemeral (node) storage: base image scratch + the 512Mi report-swap
                  # volume below (Story 29.2). A print that would exceed this is evicted — a bounded,
                  # observable failure — rather than filling node disk.
                  ephemeral-storage: "1Gi"
              securityContext:
                allowPrivilegeEscalation: false
                runAsNonRoot: true
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
                seccompProfile:
                  type: RuntimeDefault
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
                - name: report-swap
                  mountPath: /var/tmp/report-swap
                - name: api-cert
                  mountPath: /cert
              startupProbe:
                httpGet:
                  path: /api/health/readiness
                  port: http
                periodSeconds: 5
                failureThreshold: 30
              readinessProbe:
                httpGet:
                  path: /api/health/readiness
                  port: http
                periodSeconds: 5
                failureThreshold: 3
              livenessProbe:
                httpGet:
                  path: /api/health/liveness
                  port: http
                periodSeconds: 10
                failureThreshold: 3
          volumes:
            - name: tmp
              emptyDir:
                medium: Memory
                sizeLimit: 256Mi
            # Story 29.2 — dedicated DISK-backed ephemeral volume for the Jasper report swap file.
            # Deliberately NOT medium: Memory (unlike /tmp above): spilling large report page objects
            # here relieves the JVM heap onto node ephemeral storage instead of RAM, which is the whole
            # point of the virtualizer. Bounded by sizeLimit so a runaway print is evicted (a bounded,
            # observable failure) rather than silently consuming node disk. Writable despite the
            # read-only root filesystem because it is a mounted volume.
            - name: report-swap
              emptyDir:
                sizeLimit: 512Mi
            # Oracle keystore written by the init container, read by the app
            - name: api-cert
              persistentVolumeClaim:
                claimName: ${NAME}-${ZONE}-${COMPONENT}-api-cert
            - name: init-tmp
              emptyDir: {}
  - apiVersion: v1
    kind: Service
    metadata:
      labels:
        app: ${NAME}-${ZONE}
      name: ${NAME}-${ZONE}-${COMPONENT}
    spec:
      ports:
        - name: http
          port: 80
          targetPort: 8080
      selector:
        deployment: ${NAME}-${ZONE}-${COMPONENT}
  - apiVersion: autoscaling/v2
    kind: HorizontalPodAutoscaler
    metadata:
      labels:
        app: ${NAME}-${ZONE}
      name: ${NAME}-${ZONE}-${COMPONENT}
    spec:
      scaleTargetRef:
        apiVersion: apps/v1
        kind: Deployment
        name: ${NAME}-${ZONE}-${COMPONENT}
      minReplicas: ${{MIN_REPLICAS}}
      maxReplicas: ${{MAX_REPLICAS}}
      metrics:
        - type: Resource
          resource:
            name: cpu
            target:
              type: Utilization
              averageUtilization: 80
      behavior:
        scaleUp:
          stabilizationWindowSeconds: 30
          policies:
            - type: Percent
              value: 100
              periodSeconds: 60
          selectPolicy: Max
        scaleDown:
          stabilizationWindowSeconds: 300
          policies:
            - type: Percent
              value: 50
              periodSeconds: 60
          selectPolicy: Max
  # PVC for the Oracle keystore (per-ZONE so PR previews are isolated)
  - apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      labels:
        app: ${NAME}-${ZONE}
      name: ${NAME}-${ZONE}-${COMPONENT}-api-cert
    spec:
      accessModes:
        - ReadWriteMany
      resources:
        requests:
          storage: 50Mi
      storageClassName: netapp-file-standard
  - apiVersion: policy/v1
    kind: PodDisruptionBudget
    metadata:
      labels:
        app: ${NAME}-${ZONE}
      name: ${NAME}-${ZONE}-${COMPONENT}
    spec:
      maxUnavailable: 1
      selector:
        matchLabels:
          deployment: ${NAME}-${ZONE}-${COMPONENT}
