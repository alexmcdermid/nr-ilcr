spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${ILCR_OIDC_ISSUER_URI}
          jwk-set-uri: ${ILCR_OIDC_ISSUER_URI}/protocol/openid-connect/certs

ilcr:
  security:
    oidc:
      client-id: ${ILCR_OIDC_CLIENT_ID}

server:
  shutdown: graceful

logging:
  level:
    root: ${LOG_LEVEL:INFO}
