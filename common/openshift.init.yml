apiVersion: template.openshift.io/v1
kind: Template
parameters:
  - name: NAME
    description: Product name
    value: nr-ilcr
  - name: ZONE
    description: Deployment zone, e.g. pr-### or prod
    required: true
  - name: SPRING_DATASOURCE_USERNAME
    description: Oracle database username
    required: true
  - name: SPRING_DATASOURCE_PASSWORD
    description: Oracle database password
    required: true
  # Stable, non-secret password: the keystore holds only the Oracle server's
  # public cert, and a rotating value would desync from the keystore already
  # built on the PVC (the app would fail to open it after a redeploy).
  - name: ORACLEDB_KEYSTORE_SECRET
    description: Password for the Oracle keystore built by the backend init container
    value: changeit
  - name: ORACLEDB_HOST
    description: Oracle database host (environment-scoped GitHub secret)
    required: true
  - name: ORACLEDB_SERVICENAME
    description: Oracle database service name (environment-scoped GitHub secret)
    required: true
  - name: ILCR_OIDC_ISSUER_URI
    description: CSS issuer from this environment's installation JSON
    required: true
  - name: ILCR_OIDC_CLIENT_ID
    description: Public CSS client ID (installation JSON resource)
    required: true

  # Public browser configuration is generated in the environment-bound init job.
  - name: APP_ENV
    description: Application environment (dev, test, prod)
    value: dev
  - name: OIDC_IDIR_HINT
    value: azureidir
  - name: OIDC_BCEID_HINT
    value: bceidbusiness
  - name: OIDC_SITEMINDER_LOGOUT_URL
    description: Optional SiteMinder logoff override
    value: ""

objects:
  # ── Backend Secret ────────────────────────────────────────
  - apiVersion: v1
    kind: Secret
    metadata:
      name: ${NAME}-${ZONE}-backend
      labels:
        app: ${NAME}-${ZONE}
    type: Opaque
    stringData:
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      ORACLEDB_KEYSTORE_SECRET: ${ORACLEDB_KEYSTORE_SECRET}
      ORACLEDB_HOST: ${ORACLEDB_HOST}
      ORACLEDB_SERVICENAME: ${ORACLEDB_SERVICENAME}

  # Public SSO settings are not credentials and belong in a ConfigMap.
  - apiVersion: v1
    kind: ConfigMap
    metadata:
      name: ${NAME}-${ZONE}-backend-auth
      labels:
        app: ${NAME}-${ZONE}
    data:
      ILCR_OIDC_ISSUER_URI: ${ILCR_OIDC_ISSUER_URI}
      ILCR_OIDC_CLIENT_ID: ${ILCR_OIDC_CLIENT_ID}

  # ── Frontend OIDC ConfigMap (runtime-injected, mounted by the frontend
  #    Deployment over the repo's mock-auth placeholder public/config.js;
  #    see frontend/src/env.ts). Issuer/client ids are public identifiers — every
  #    browser downloads this file — so surfacing them here is fine. ──
  - apiVersion: v1
    kind: ConfigMap
    metadata:
      name: ${NAME}-${ZONE}-frontend-config
      labels:
        app: ${NAME}-${ZONE}
    data:
      config.js: |
        window.appConfig = {
          mockUser: false,
          appEnv: '${APP_ENV}',
          oidcIssuerUri: '${ILCR_OIDC_ISSUER_URI}',
          oidcClientId: '${ILCR_OIDC_CLIENT_ID}',
          oidcIdirHint: '${OIDC_IDIR_HINT}',
          oidcBceidHint: '${OIDC_BCEID_HINT}',
          oidcSiteminderLogoutUrl: '${OIDC_SITEMINDER_LOGOUT_URL}',
        };

  - apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: ${NAME}-${ZONE}-frontend-ingress
      labels:
        app: ${NAME}-${ZONE}
    spec:
      podSelector:
        matchLabels:
          deployment: ${NAME}-${ZONE}-frontend
      ingress:
        - from:
            - namespaceSelector:
                matchLabels:
                  network.openshift.io/policy-group: ingress
      policyTypes:
        - Ingress
  - apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: ${NAME}-${ZONE}-backend-ingress
      labels:
        app: ${NAME}-${ZONE}
    spec:
      podSelector:
        matchLabels:
          deployment: ${NAME}-${ZONE}-backend
      ingress:
        - from:
            - podSelector:
                matchLabels:
                  app: ${NAME}-${ZONE}
                  deployment: ${NAME}-${ZONE}-frontend
      policyTypes:
        - Ingress
